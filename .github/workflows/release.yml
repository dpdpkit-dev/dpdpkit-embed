# Release on tag vX.Y.Z after @dpdpkit/client X.Y.Z is published (release-train order).
# package.json version must match the tag. Publishes as "latest".
# Requires the NPM_TOKEN secret (or npm trusted publishing) — task SETUP-08.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm provenance
    env:
      # registry-url writes an .npmrc that reads this; setup-node v7 no longer exports a placeholder.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "tag=next" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi
      - name: Test against @dpdpkit/client at the release version
        run: |
          npm pkg set "devDependencies.@dpdpkit/client=${{ steps.v.outputs.version }}"
          # @dpdpkit/client may have been published moments ago; give npm up to ~10 minutes.
          for attempt in $(seq 1 20); do
            npm install --no-audit --no-fund && break
            if [ "$attempt" = 20 ]; then echo "@dpdpkit/client not available on npm"; exit 1; fi
            echo "@dpdpkit/client not on npm yet; retrying in 30s ($attempt/20)"; sleep 30
          done
      - run: npm run typecheck && npm test && npm run build
      # Every release goes to "latest" while all versions are pre-releases. Use steps.v.outputs.tag once a stable release exists.
      - run: npm publish --provenance --access public --tag latest
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Release notes
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## " { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          prerelease: ${{ steps.v.outputs.tag == 'next' }}
          files: sbom.spdx.json
